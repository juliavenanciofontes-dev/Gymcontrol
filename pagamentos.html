
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymControl | Cadastro de Pagamentos</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">

        <a href="index.html" class="logo">
            <img src="imagens/logo.png"
                 alt="GymControl - Sistema de gerenciamento de academia">
        </a>

        <!-- MENU DE NAVEGAÇÃO -->
        <nav class="menu">

            <a href="index.html" class="menu-link">
                <img src="imagens/inicio.png" alt="">
                <span>Início</span>
            </a>

            <a href="alunos.html" class="menu-link">
                <img src="imagens/alunos.png" alt="">
                <span>Alunos</span>
            </a>

            <a href="planos.html" class="menu-link">
                <img src="imagens/planos.png" alt="">
                <span>Planos</span>
            </a>

            <a href="pagamentos.html" class="menu-link ativo"
               aria-current="page">
                <img src="imagens/pagamentos.png" alt="">
                <span>Pagamentos</span>
            </a>

            <a href="relatorios.html" class="menu-link">
                <img src="imagens/relatorios.png" alt="">
                <span>Relatórios</span>
            </a>

        </nav>

        <a href="index.html" class="botao-sair">
            Sair
        </a>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="pagina-cadastro">

        <!-- VOLTAR PARA A PÁGINA INICIAL -->
        <a href="index.html" class="voltar">
            &larr; Voltar para a página inicial
        </a>


        <!-- TÍTULO DA PÁGINA -->
        <section class="titulo-pagina">

            <p class="subtitulo-pagina">
                CADASTRO DE
            </p>

            <h1>Pagamentos</h1>

            <p>
                Registre os pagamentos realizados pelos alunos.
            </p>

        </section>


        <!-- FORMULÁRIO DE PAGAMENTO -->
        <section class="formulario-container">

            <form class="formulario" action="#" method="post">

                <!-- ALUNO -->
                <div class="campo">

                    <label for="aluno">
                        <span class="icone-campo">
                            <img src="imagens/alunos.png" alt="">
                        </span>
                        Aluno <span class="obrigatorio">*</span>
                    </label>

                    <select id="inpAluno" name="aluno" required>

                        <option value="" selected disabled>
                            Selecione o aluno
                        </option>

                    </select>

                </div>


                <!-- VALOR -->
                <div class="campo">

                    <label for="valor">
                        <span class="icone-campo">
                            <img src="imagens/valor.png" alt="">
                        </span>
                        Valor <span class="obrigatorio">*</span>
                    </label>

                    <input
                        type="number"
                        id="inpValor"
                        name="valor"
                        placeholder="R$ 0,00"
                        min="0.01"
                        step="0.01"
                        required
                    >

                </div>


                <!-- DATA DO PAGAMENTO -->
                <div class="campo">

                    <label for="dataPagamento">
                        <span class="icone-campo">
                            <img src="imagens/calendario.png" alt="">
                        </span>
                        Data do pagamento
                        <span class="obrigatorio">*</span>
                    </label>

                    <input
                        type="date"
                        id="inpDataPagamento"
                        name="dataPagamento"
                        required
                    >

                </div>


                <!-- FORMA DE PAGAMENTO -->
                <div class="campo">

                    <label for="formaPagamento">
                        <span class="icone-campo">
                            <img src="imagens/pagamentos.png" alt="">
                        </span>
                        Forma de pagamento
                        <span class="obrigatorio">*</span>
                    </label>

                    <select
                        id="inpFormaPagamento"
                        name="formaPagamento"
                        required
                    >

                        <option value="" selected disabled>
                            Selecione a forma de pagamento
                        </option>

                        <option value="pix">Pix</option>

                        <option value="dinheiro">Dinheiro</option>

                        <option value="credito">Cartão de crédito</option>

                        <option value="debito">Cartão de débito</option>

                    </select>

                </div>


                <!-- BOTÃO REGISTRAR PAGAMENTO -->
                <div class="acoes-formulario">

                    <button type="button" class="botao-cadastrar" onclick="cadastrarPagamento()">

                        <span class="icone-botao" aria-hidden="true">
                            <img src="imagens/cadastrar-pagamentos.png" alt="">
                        </span>

                        Registrar pagamento

                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer class="rodape">

        <a href="index.html" class="rodape-logo">
            <img src="imagens/logo.png" alt="GymControl">
        </a>

        <p>Mais organização para o seu negócio.</p>

        <div class="rodape-slogan">
            DISCIPLINA &bull; FOCO &bull; RESULTADOS
        </div>

    </footer>

    <script src="Modelo.js"></script>
    <script src="controlador.js"></script>
    <script>carregarAlunos()</script>
</body>

</html>
